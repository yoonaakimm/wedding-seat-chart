<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seating Plan</title>
<meta name="description" content="Plan your wedding seating chart: drag guests onto tables, track dietary needs, flag who must sit apart, and export for your venue.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#33201F; --night-2:#5D4848; --night-3:#6B5252;
    --paper:#F4F2EC; --paper-2:#DCCFC6;
    --ink:#4E2323; --ink-soft:#6E665C;
    --brass:#8F6C51; --sage:#857B4D; --claret:#906262; --gold-lit:#B7957C; --rose-lit:#CCAD9B; --mist:#C7C2AE; --kelp:#52503A;
    --line:rgba(78,35,35,.18);
    --display:"Bodoni Moda",Didot,"Bodoni MT",Georgia,serif;
    --body:"Karla",ui-sans-serif,system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--body);color:var(--ink);background:var(--paper)}
  button{font-family:var(--body);cursor:pointer}
  input,select,textarea{font-family:var(--body);color:var(--ink)}

  .app{display:flex;flex-direction:column;height:100vh;height:100dvh;min-height:520px}

  header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:11px 18px;
    border-bottom:1px solid var(--line)}
  .brand{font-family:var(--display);font-size:23px;line-height:1;white-space:nowrap}
  .brand em{font-style:italic;color:var(--brass)}
  .evt{border:0;background:transparent;padding:2px 4px;font-family:var(--display);font-style:italic;
    font-size:16px;color:var(--ink-soft);white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
  .evt:hover{color:var(--ink)}
  .tabs{display:flex;border:1px solid var(--line);border-radius:2px;overflow:hidden}
  .tabs button{border:0;background:transparent;padding:7px 15px;font-size:11px;
    letter-spacing:.13em;text-transform:uppercase;color:var(--ink-soft)}
  .tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
  .stat{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-soft);white-space:nowrap}
  .stat b{font-family:var(--display);font-size:17px;color:var(--ink);letter-spacing:0}
  .spacer{flex:1}
  .save{cursor:pointer;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-soft);min-width:64px;text-align:right}

  .save.bad{color:var(--claret);font-weight:700}
  .btn{border:1px solid var(--line);background:transparent;color:var(--ink);padding:7px 12px;
    border-radius:2px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
  .btn:hover{background:var(--paper-2)}
  .btn.solid{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .btn.solid:hover{background:#65332F}
  .btn.tiny{padding:4px 8px;font-size:10px;letter-spacing:.06em}
  .btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,
  .seat:focus-visible,.gcard:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

  .view{flex:1;display:flex;min-height:0}
  .view[hidden]{display:none}

  /* ---------- floor view ---------- */
  aside{width:290px;flex-shrink:0;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .side-h{padding:11px 13px 9px;border-bottom:1px solid var(--line)}
  .side-h h2{margin:0 0 8px;font-family:var(--display);font-size:15px;font-weight:400}
  .field{width:100%;padding:6px 9px;border:1px solid var(--line);border-radius:2px;background:#fff;font-size:13px}
  .filters{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:3px 10px;
    font-size:11px;color:var(--ink-soft)}
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .glist{flex:1;overflow-y:auto;padding:6px 9px 80px}
  .ghead{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);
    padding:11px 4px 5px;border-bottom:1px solid var(--line);margin-bottom:5px}
  .gcard{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:6px 9px;
    margin-bottom:3px;border:1px solid transparent;border-radius:2px;background:#fff;font-size:13px;color:var(--ink)}
  .gcard:hover{border-color:var(--line)}
  .gcard.seated{background:transparent;color:var(--ink-soft)}
  .gcard.held{background:var(--gold-lit);border-color:var(--gold-lit);color:#3A2320;font-weight:700}
  .gcard .nm{flex:1}
  .gcard .mt{font-size:9.5px;letter-spacing:.06em;color:var(--ink-soft);text-transform:uppercase;text-align:right;max-width:88px}
  .gcard.held .mt{color:rgba(58,35,32,.62)}
  .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
  .dot.bride{background:var(--claret)}.dot.groom{background:var(--kelp)}.dot.both{background:var(--brass)}
  .empty{padding:24px 12px;text-align:center;color:var(--ink-soft);font-size:13px;line-height:1.5}

  .floorwrap{flex:1;position:relative;overflow:hidden;background:#F3F0E9;
    background-image:radial-gradient(circle at 50% 18%,#FFFDFA 0%,#EDE8DE 72%)}
  .floorscroll{position:absolute;inset:0;overflow:auto}
  .floor{position:relative;width:1700px;height:1760px;transform-origin:0 0}
  .tether{position:absolute;inset:0;pointer-events:none;overflow:visible}
  .zone{position:absolute;transform:translate(-50%,-50%);text-align:center;cursor:grab;user-select:none;
    color:rgba(110,102,92,.62);font-size:13px;letter-spacing:.24em;text-transform:uppercase;white-space:nowrap}
  .zone:active{cursor:grabbing}
  .zone{touch-action:none}
  .actions{display:flex;gap:8px;align-items:center}
  .side-toggle{display:none}
  .drop{border:1.5px dashed rgba(143,108,81,.55);border-radius:3px;padding:20px 14px;text-align:center;
    background:rgba(255,253,250,.7);font-size:13px;color:var(--ink-soft);line-height:1.6}
  .drop.over{background:rgba(143,108,81,.14);border-color:var(--brass)}
  .drop b{color:var(--ink)}
  .prev{margin-top:14px;font-size:13px}
  .prev .ok{color:var(--ink)}
  .prev .bad{color:var(--claret)}
  .prev table{width:100%;border-collapse:collapse;margin-top:8px;font-size:12px}
  .prev th{text-align:left;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);
    font-weight:500;padding:4px 6px;border-bottom:1px solid var(--line)}
  .prev td{padding:4px 6px;border-bottom:1px solid var(--line)}
  .shapes{display:flex;gap:6px}
  .shapes button{flex:1;border:1px solid var(--line);background:#fff;border-radius:2px;padding:8px 4px 6px;
    font-size:11px;color:var(--ink-soft);display:flex;flex-direction:column;align-items:center;gap:6px}
  .shapes button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
  .shapes button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
  .shapes i{display:block;background:var(--paper-2);border:1px solid rgba(0,0,0,.15)}
  .zone.box{border:1px solid rgba(110,102,92,.3);border-radius:2px;padding:9px 20px;letter-spacing:.16em}
  .table{position:absolute;transform:translate(-50%,-50%)}
  .surface{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    border:1px solid rgba(0,0,0,.14);border-radius:3px;cursor:grab;touch-action:none}
  .surface:active{cursor:grabbing}
  .table.full .surface{box-shadow:0 0 0 3px rgba(143,108,81,.22)}
  .table.over .surface{border-color:var(--claret);box-shadow:0 0 0 3px rgba(144,98,98,.22)}
  .tname{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;
    pointer-events:none;width:118px}
  .tname .no{font-family:var(--display);font-size:27px;line-height:1}
  .tname .n{font-family:var(--display);font-style:italic;font-size:15px;line-height:1.2;margin-top:4px}
  .tname .c{font-size:11px;letter-spacing:.13em;text-transform:uppercase;opacity:.62;margin-top:5px}
  .seat{position:absolute;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;
    border:1.5px solid rgba(0,0,0,.16);background:#FFFDFA;color:var(--ink);
    display:flex;align-items:center;justify-content:center;padding:3px;font-size:10.5px;line-height:1.1;
    text-align:center;overflow:hidden;word-break:break-word;transition:transform .1s}
  
  .seat.off{display:none}
  .floor.chairs .seat{cursor:crosshair}
  .floor.chairs .seat.off{display:flex;opacity:.32;background:transparent!important;
    border-style:dashed!important;box-shadow:none!important}
  .seat.vip{box-shadow:0 0 0 2.5px var(--brass),0 0 0 5px rgba(143,108,81,.22);z-index:4}
  .gcard.vip{border-left:3px solid var(--brass)}
  .gcard.vip .nm{font-family:var(--display);font-style:italic;font-size:14px}
  .vipmark{color:var(--brass);font-size:11px}
  .hint{position:absolute;left:38%;bottom:14px;transform:translateX(-50%);z-index:30;
    background:var(--ink);color:var(--paper);padding:6px 13px;border-radius:2px;font-size:11.5px}
  .seat.clash{border:2.5px solid var(--claret)!important;box-shadow:0 0 0 3px rgba(144,98,98,.28)}
  .seat.target{border-color:var(--brass)!important;background:rgba(143,108,81,.26)!important}
  .picking .seat:not(.taken){border-color:var(--brass);border-style:dashed}
  .seat:hover{transform:scale(1.12);z-index:6}

  .floor-tools{position:absolute;right:14px;bottom:14px;display:flex;gap:6px;z-index:30}
  .floor-tools .btn{background:rgba(255,253,250,.94);color:var(--ink);border-color:var(--line);
    box-shadow:0 2px 8px rgba(78,35,35,.09)}
  .floor-tools .btn:hover{background:#fff}
  .hand{position:absolute;left:38%;bottom:14px;transform:translateX(-50%);z-index:30;background:var(--gold-lit);
    color:#3A2320;padding:9px 15px;border-radius:2px;font-size:13px;display:flex;gap:12px;align-items:center;
    box-shadow:0 6px 22px rgba(0,0,0,.4)}
  .hand b{font-family:var(--display);font-weight:600;font-size:15px}
  .hand button{border:0;background:rgba(58,35,32,.15);color:#3A2320;border-radius:2px;padding:3px 9px;
    font-size:10px;letter-spacing:.1em;text-transform:uppercase}
  .warn{position:absolute;right:14px;top:14px;width:246px;z-index:30;background:rgba(255,253,250,.97);
    border:1px solid rgba(144,98,98,.42);border-radius:2px;padding:10px 12px;
    box-shadow:0 4px 18px rgba(78,35,35,.12)}
  .warn h3{margin:0 0 6px;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--claret)}
  .warn ul{margin:0;padding-left:15px;color:var(--ink);font-size:12px;line-height:1.45}
  .warn li{margin-bottom:4px}

  /* ---------- sheet view ---------- */
  .sheet{flex:1;overflow-y:auto;padding:20px 26px 70px}
  .sheet-h{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:14px}
  .sheet-h h1{margin:0;font-family:var(--display);font-size:30px;font-weight:400}
  .sheet-h .sub{color:var(--ink-soft);font-size:13px;margin:0}
  table.gt{width:100%;border-collapse:collapse;font-size:13px}
  table.gt th{text-align:left;font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;
    color:var(--ink-soft);font-weight:500;padding:7px 6px;border-bottom:1px solid var(--ink);cursor:pointer}
  table.gt td{padding:2px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
  table.gt tr.on td{background:rgba(143,108,81,.09)}
  .cell{width:100%;border:1px solid transparent;background:transparent;padding:5px 6px;
    border-radius:2px;font-size:13px}
  .cell:hover{border-color:var(--line);background:#fff}
  .cell:focus{border-color:var(--brass);background:#fff;outline:none}
  select.cell{cursor:pointer}
  .dietcell{display:flex;gap:6px;align-items:center}
  .dietcell select{flex:0 0 45%}
  .dietcell .note2{flex:1;font-size:12px}
  .num{font-family:var(--display);color:var(--ink-soft);font-size:12px;width:34px;text-align:right;padding-right:8px}
  .x{border:0;background:transparent;color:var(--ink-soft);font-size:15px;line-height:1;padding:3px 7px}
  .x:hover{color:var(--claret)}

  /* ---------- modal ---------- */
  .veil{position:fixed;inset:0;background:rgba(43,29,28,.64);display:flex;align-items:center;
    justify-content:center;padding:20px;z-index:60}
  .modal{background:var(--paper);border-radius:3px;padding:22px;width:100%;max-width:560px;
    max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.42)}
  .modal h2{margin:0 0 4px;font-family:var(--display);font-size:22px;font-weight:400}
  .modal p.sub{margin:0 0 15px;color:var(--ink-soft);font-size:13px;line-height:1.5}
  .modal label{display:block;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-soft);margin:12px 0 5px}
  .modal textarea{width:100%;min-height:180px;padding:10px;border:1px solid var(--line);
    border-radius:2px;font-size:13px;line-height:1.5;resize:vertical}
  .modal textarea.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
  .row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
  .row>*{flex:1;min-width:104px}
  .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
  .rule{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)}
  .kind{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:99px}
  .kind.apart{background:rgba(144,98,98,.16);color:var(--claret)}
  .kind.together{background:rgba(133,123,77,.22);color:#5A5333}
  .who{flex:1}
  .trow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
  .sw{display:inline-flex;gap:3px}
  .sw button{width:15px;height:15px;padding:0;border:1px solid rgba(0,0,0,.18);border-radius:2px}
  .sw button[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:1px}
  .note{font-size:12px;color:var(--ink-soft);line-height:1.55;margin-top:14px;
    border-left:2px solid var(--brass);padding-left:11px}
  .modal h3{margin:20px 0 4px;font-family:var(--display);font-size:16px;font-weight:400}
  .check{display:flex!important;align-items:center;gap:8px;text-transform:none!important;letter-spacing:0!important;
    font-size:13px!important;color:var(--ink)!important}
  .vipbtn{border:0;background:transparent;color:var(--ink-soft);font-family:var(--display);font-size:12px;padding:2px 4px}
  .vipbtn:hover{color:var(--brass)}
  .vipbtn.on{color:var(--brass)}

  .modal.wide{max-width:700px}
  @media (max-width:900px){
    header{gap:8px 12px;padding:9px 12px}
    .actions{order:9;width:100%;overflow-x:auto;padding-bottom:2px}
    .actions .spacer{display:none}
    .view{position:relative}
    aside{position:absolute;z-index:40;top:0;bottom:0;left:0;max-width:86vw;background:var(--paper);
      box-shadow:6px 0 24px rgba(0,0,0,.2);transform:translateX(-105%);transition:transform .2s}
    aside.open{transform:none}
    .side-toggle{display:inline-block;position:absolute;left:12px;bottom:14px;z-index:30}
    .floor-tools{right:10px;bottom:14px}
    .hand,.hint{left:50%;bottom:62px;max-width:92vw}
    .warn,.stat-open{display:none}
    .sheet{padding:14px 12px 60px}
    table.gt th:nth-child(5),table.gt td:nth-child(5){display:none}
  }
  @media print{
    header,aside,.floor-tools,.x,.veil{display:none!important}
    .sheet{padding:0;overflow:visible}
    .cell{border-color:transparent!important;background:transparent!important}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="brand">Seating <em>Plan</em></div>
    <button class="evt" id="evt" title="Rename this plan"></button>
    <div class="tabs">
      <button id="tab-sheet" aria-selected="false">Guest sheet</button>
      <button id="tab-floor" aria-selected="true">Floor plan</button>
    </div>
    <div class="stat">Seated <b id="s-seated">0</b> / <span id="s-total">0</span></div>
    <div class="stat stat-open">Open <b id="s-open">0</b></div>
    <div class="spacer"></div>
    <div class="actions">
      <button class="btn" id="b-import">Add guests</button>
      <button class="btn" id="b-table">Tables</button>
      <button class="btn" id="b-rules">Rules</button>
      <button class="btn" id="b-new">New plan</button>
      <button class="btn solid" id="b-export">Export &amp; backup</button>
      <div class="save" id="save" title="Your plan is saved in this browser only">saved</div>
    </div>
  </header>

  <!-- FLOOR -->
  <div class="view" id="v-floor">
    <aside id="aside">
      <div class="side-h">
        <h2>Guests</h2>
        <input class="field" id="q" placeholder="Search a name, group or diet">
        <div class="filters">
          <button class="chip" id="f-unseated" aria-pressed="false">Unseated only</button>
          <button class="chip" id="f-diet" aria-pressed="false">Dietary needs</button>
        </div>
      </div>
      <div class="glist" id="glist"></div>
    </aside>
    <div class="floorwrap" id="floorwrap">
      <div class="floorscroll" id="floorscroll">
        <div id="sizer" style="position:relative;overflow:hidden">
          <div class="floor" id="floor"><svg class="tether" id="tether"></svg></div>
        </div>
      </div>
      <button class="btn tiny side-toggle" id="b-side" style="background:var(--ink);color:var(--paper)">Guests</button>
      <div class="floor-tools">
        <button class="btn tiny" id="z-out">&minus;</button>
        <button class="btn tiny" id="z-in">+</button>
        <button class="btn tiny" id="z-fit">Fit</button>
        <button class="btn tiny" id="b-chairs" aria-pressed="false">Edit chairs</button>
        <button class="btn tiny" id="b-addtable">Add table</button>
      </div>
      <div id="handbar"></div><div id="warnbox"></div>
    </div>
  </div>

  <!-- SHEET -->
  <div class="view" id="v-sheet" hidden>
    <div class="sheet">
      <div class="sheet-h">
        <h1>Guest list</h1>
        <p class="sub" id="sheet-sub"></p>
        <div class="spacer"></div>
        <input class="field" id="q2" placeholder="Search" style="max-width:190px">
        <button class="btn" id="b-addrow">Add guest</button>
        <button class="btn" id="b-print">Print</button>
      </div>
      <table class="gt">
        <thead><tr>
          <th style="width:34px"></th>
          <th data-sort="name">Name</th>
          <th data-sort="table" style="width:19%">Table</th>
          <th data-sort="diet" style="width:27%">Dietary</th>
          <th data-sort="note" style="width:24%">Notes</th>
          <th style="width:32px"></th>
        </tr></thead>
        <tbody id="gt-body"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";
const KEY="seating-plan-v1";
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const ZONES=[{x:880,y:90,label:"Bar",box:true},{x:880,y:215,label:"Dance Floor",box:false},{x:450,y:215,label:"DJ",box:true}];

/* A fictional plan so people can see how it works before entering their own. */
function samplePlan(){
  const names=["Avery Brooks","Jordan Ellis","Priya Nair","Marcus Bell","Sofia Romero","Liam Carter",
    "Hana Sato","Noah Fischer","Grace Okoye","Ethan Park","Chloe Martin","Daniel Reyes","Maya Cohen",
    "Owen Walsh","Isla Murphy","Lucas Silva","Zoe Turner","Ben Adler","Nina Petrova","Sam Rivera",
    "Ruth Brooks","Paul Brooks","Linda Ellis","Gary Ellis","Tessa Grant","Kai Mendes","Ella Novak",
    "Theo Laurent","Amara Diallo","Jun Watanabe","Iris Holm","Felix Weber"];
  const guests=names.map((n,i)=>({id:"s"+i,name:n,diet:"",dietNote:"",note:""}));
  guests[0].role="couple";guests[1].role="couple";
  guests[2].diet="Vegetarian";guests[8].diet="Nut allergy";guests[8].dietNote="Severe, carries EpiPen";
  guests[13].diet="Gluten-free";guests[20].note="Avery's parents";guests[21].note="Avery's parents";
  const plan={title:"Avery & Jordan",zones:JSON.parse(JSON.stringify(ZONES)),seats:{},
    rules:[{id:"r1",type:"apart",a:"s5",b:"s15"}],
    tables:buildTables(6,8,"round",true)};
  plan.guests=guests;
  const head=plan.tables[0];
  ["s0","s1","s20","s21","s22","s23"].forEach((g,i)=>plan.seats[head.id+":"+i]=g);
  ["s2","s3","s4","s5","s6","s7","s8"].forEach((g,i)=>plan.seats[plan.tables[1].id+":"+i]=g);
  ["s9","s10","s11","s12","s15"].forEach((g,i)=>plan.seats[plan.tables[2].id+":"+i]=g);
  return plan;
}
function blankPlan(){return{title:"",guests:[],tables:[],zones:JSON.parse(JSON.stringify(ZONES)),seats:{},rules:[]};}

/* Lay out n guest tables in a grid, plus an optional head table at the front. */
function buildTables(n,seats,shape,head){
  const out=[];
  if(head)out.push({id:uid(),no:1,name:"Head Table",shape:"rect",seats:Math.max(seats,8),off:[],
    color:"#B7957C",x:880,y:410});
  const cols=(shape!=="rect"&&n>16)?5:4;
  const dx=shape==="rect"?380:(shape==="round"?320:330), dy=shape==="tall"?330:(shape==="round"?340:300);
  const y0=(head?410+(shape==="tall"?330:300):430);
  for(let i=0;i<n;i++){
    const r=Math.floor(i/cols), c=i%cols, inRow=Math.min(cols,n-r*cols);
    const no=out.length+1;
    out.push({id:uid(),no:no,name:"Table "+no,shape:shape,seats:seats,off:[],
      color:PAL[(no-1)%PAL.length],x:880+(c-(inRow-1)/2)*dx,y:y0+r*dy});
  }
  return out;
}

let S=blankPlan();
let held=null, zoom=.62, filters={unseated:false,diet:false};
let query="", query2="", sortBy="name", loaded=false, view="floor", chairMode=false;
const nodes={};   // table id -> DOM node, deliberately kept OUT of saved state

/* ---------- storage ---------- */
/* Plans live in this browser's localStorage. Nothing is sent to a server,
   so the guest list stays on the couple's own device. */
function normalize(v){
  return{title:v.title||"",guests:v.guests||[],tables:v.tables||[],
    zones:Array.isArray(v.zones)?v.zones:JSON.parse(JSON.stringify(ZONES)),seats:v.seats||{},rules:v.rules||[]};
}
function load(){
  let found=false;
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){S=normalize(JSON.parse(raw));found=true;}
  }catch(e){console.error("load failed",e);}
  loaded=true;lastSaved=found?serialize():"";render();
  if(!found)welcome();else requestAnimationFrame(fit);
}
let lastSaved="";
function serialize(){return JSON.stringify(S,(k,v)=>k.charAt(0)==="_"?undefined:v);}
function setSaveState(txt,bad){const el=$("#save");el.textContent=txt;el.classList.toggle("bad",!!bad);}
function save(){
  if(!loaded)return;
  const body=serialize();
  if(body===lastSaved){setSaveState("saved",false);return;}
  try{
    localStorage.setItem(KEY,body);
    lastSaved=body;setSaveState("saved",false);
  }catch(e){
    console.error("save failed",e);
    setSaveState("NOT SAVED — download a backup",true);
  }
}
function replacePlan(p){S=normalize(p);held=null;save();render();}
let t_;
function touch(){clearTimeout(t_);t_=setTimeout(save,400);}
function download(name,text,type){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([text],{type:type}));a.download=name;
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},0);
}
function fileSlug(){return(S.title||"seating-plan").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"seating-plan";}

/* ---------- helpers ---------- */
const guest=id=>S.guests.find(g=>g.id===id);
const table=id=>S.tables.find(t=>t.id===id);
function seatOf(gid){for(const k in S.seats)if(S.seats[k]===gid)return k;return null;}
function tableOf(gid){const k=seatOf(gid);return k?k.slice(0,k.lastIndexOf(":")):null;}
function countAt(tid){let n=0;for(const k in S.seats)if(k.slice(0,k.lastIndexOf(":"))===tid)n++;return n;}
const offOf=t=>t.off||[];
const cap=t=>t.seats-offOf(t).length;
const totalSeats=()=>S.tables.reduce((a,t)=>a+cap(t),0);
const seatedCount=()=>Object.keys(S.seats).length;
function firstOpen(tid){
  const t=table(tid);if(!t)return null;
  const off=offOf(t);
  for(let i=0;i<t.seats;i++){if(off.includes(i))continue;const k=tid+":"+i;if(!S.seats[k])return k;}
  return null;
}
function clashes(){
  const out=[];
  for(const r of S.rules){
    const a=guest(r.a),b=guest(r.b);if(!a||!b)continue;
    const ta=tableOf(r.a),tb=tableOf(r.b);
    if(r.type==="apart"&&ta&&tb&&ta===tb)
      out.push({rule:r,a:r.a,b:r.b,text:a.name+" and "+b.name+" are both at "+(table(ta)||{}).name});
    if(r.type==="together"&&ta&&tb&&ta!==tb)
      out.push({rule:r,a:r.a,b:r.b,text:a.name+" and "+b.name+" are split apart"});
  }
  return out;
}

/* ---------- geometry ---------- */
function geo(t){
  const per=Math.ceil(t.seats/2);
  if(t.shape==="round"){const r=105;return{k:"round",r:r,size:r*2,sr:r+34,per:per};}
  if(t.shape==="tall"){return{k:"tall",w:150,h:270,per:per};}
  return{k:"rect",w:290,h:150,per:per};
}
function chairSize(t){
  const g=geo(t), nMax=Math.max(g.per,t.seats-g.per)||1;
  const step=g.k==="round"?(2*Math.PI*g.sr/Math.max(1,t.seats)):((g.k==="tall"?g.h:g.w)/nMax);
  const d=Math.max(22,Math.min(48,step-8));
  return{d:d,f:Math.max(6.5,Math.min(10.5,d*0.23))};
}
function seatXY(t,i){
  const g=geo(t);
  if(g.k==="round"){const a=(-90+i*360/t.seats)*Math.PI/180;
    return{x:Math.cos(a)*g.sr,y:Math.sin(a)*g.sr};}
  const first=i<g.per, idx=first?i:i-g.per, n=first?g.per:t.seats-g.per;
  if(g.k==="tall"){const step=g.h/n;
    return{x:first?-g.w/2-30:g.w/2+30, y:-g.h/2+step*(idx+.5)};}
  const step=g.w/n;
  return{x:-g.w/2+step*(idx+.5), y:first?-g.h/2-30:g.h/2+30};
}

const DIETS=["Vegetarian","Vegan","Pescatarian","Gluten-free","Dairy-free","Nut allergy",
  "Shellfish allergy","Halal","Kosher","Kids meal","Other"];
const dietOpts='<option value="">—</option>'+DIETS.map(d=>'<option value="'+d+'">'+d+"</option>").join("");
const roleLabel=r=>r==="couple"?"Couple":(r==="vip"?"VIP":r);
const hasDiet=g=>!!((g.diet||"").trim()||(g.dietNote||"").trim());
const PAL=["#906262","#52503A","#B7957C","#857B4D","#6E665C","#CCAD9B","#C7C2AE","#5D4848","#8F6C51","#4E2323"];
function rgbOf(h){h=h.replace("#","");return[0,2,4].map(i=>parseInt(h.substr(i,2),16));}
function textOn(h){const[r,g,b]=rgbOf(h);return(0.299*r+0.587*g+0.114*b)/255>0.63?"#3A2320":"#FFFDFA";}
function fade(h,a){const[r,g,b]=rgbOf(h);return"rgba("+r+","+g+","+b+","+a+")";}

/* ---------- render ---------- */
function render(){stats();renderGuests();renderFloor();renderHand();renderWarn();renderSheet();}
function stats(){
  const t=(S.title||"").trim();

function renderGuests(){
  const box=$("#glist");box.innerHTML="";
  if(!S.guests.length){box.innerHTML='<div class="empty">No guests yet.</div>';return;}
  let list=S.guests.slice().sort((a,b)=>a.name.localeCompare(b.name));
  const q=query.trim().toLowerCase();
  if(q)list=list.filter(g=>(g.name+" "+(g.group||"")+" "+(g.note||"")+" "+(g.diet||"")+" "+(g.dietNote||"")).toLowerCase().includes(q));
  if(filters.unseated)list=list.filter(g=>!seatOf(g.id));
  if(filters.diet)list=list.filter(hasDiet);
  if(!list.length){box.innerHTML='<div class="empty">No guests match that.</div>';return;}
  const gr={};
  list.forEach(g=>{const t=table(tableOf(g.id));
    const k=t?(t.no+". "+t.name):"Not yet seated";(gr[k]=gr[k]||[]).push(g);});
  const rank=k=>k==="Not yet seated"?-1:parseInt(k,10);
  Object.keys(gr).sort((a,b)=>rank(a)-rank(b)).forEach(k=>{
    const h=document.createElement("div");h.className="ghead";h.textContent=k+" · "+gr[k].length;box.appendChild(h);
    gr[k].forEach(g=>{
      const tid=tableOf(g.id);
      const b=document.createElement("button");
      b.className="gcard"+(tid?" seated":"")+(held===g.id?" held":"")+(g.role?" vip":"");
      b.draggable=true;
      b.innerHTML='<span class="dot"></span><span class="nm"></span><span class="mt"></span>';
      b.querySelector(".nm").textContent=g.name;
      const td=tid?table(tid):null;
      b.querySelector(".dot").style.background=g.role?"#8F6C51":(td?td.color:"rgba(110,102,92,.35)");
      b.querySelector(".mt").textContent=g.role?roleLabel(g.role):(hasDiet(g)?(g.diet||"Note"):"");
      b.onclick=()=>{held=(held===g.id?null:g.id);
        if(held&&innerWidth<=900)$("#aside").classList.remove("open");render();};
      b.ondragstart=e=>{held=g.id;e.dataTransfer.setData("text/plain",g.id);renderFloor();renderHand();};
      box.appendChild(b);
    });
  });
}

function renderFloor(){
  const floor=$("#floor");
  [...floor.querySelectorAll(".table,.zone")].forEach(n=>n.remove());
  floor.style.transform="scale("+zoom+")";
  floor.style.height=floorH()+"px";
  const sz=$("#sizer");sz.style.width=(1700*zoom)+"px";sz.style.height=(floorH()*zoom)+"px";
  floor.classList.toggle("picking",!!held);
  floor.classList.toggle("chairs",chairMode);

  (S.zones||[]).forEach(z=>{
    const el=document.createElement("div");
    el.className="zone"+(z.box?" box":"");
    el.style.left=z.x+"px";el.style.top=z.y+"px";
    el.textContent=z.label;el.title="Drag to move. Rename in Tables.";
    el.onpointerdown=e=>dragZone(e,z,el);floor.appendChild(el);
  });

  const bad=new Set();
  clashes().forEach(c=>{const a=seatOf(c.a),b=seatOf(c.b);if(a)bad.add(a);if(b)bad.add(b);});

  S.tables.forEach(t=>{
    const g=geo(t), n=countAt(t.id);
    const col=t.color||"#6E665C", tc=textOn(col), cs=chairSize(t);
    const el=document.createElement("div");
    el.className="table"+(n>=cap(t)?" full":"");

    const surf=document.createElement("div");surf.className="surface";
    surf.style.background=col;surf.style.borderColor=fade(col,.55);
    if(g.k==="round"){surf.style.width=surf.style.height=g.size+"px";surf.style.borderRadius="50%";}
    else{surf.style.width=g.w+"px";surf.style.height=g.h+"px";}
    surf.onpointerdown=e=>dragTable(e,t);
    el.appendChild(surf);

    const nm=document.createElement("div");nm.className="tname";
    nm.style.width=(g.k==="round"?140:g.w-14)+"px";
    nm.innerHTML='<div class="no"></div><div class="n"></div><div class="c">'+n+" / "+cap(t)+"</div>";
    nm.style.color=tc;nm.querySelector(".no").textContent=t.no||"";
    const nEl=nm.querySelector(".n");nEl.textContent=t.name;
    if(t.name.length>15)nEl.style.fontSize="13px";
    el.appendChild(nm);

    for(let i=0;i<t.seats;i++){
      const k=t.id+":"+i, gid=S.seats[k], p=seatXY(t,i);
      const isOff=offOf(t).includes(i), gu=gid?guest(gid):null;
      const s=document.createElement("button");
      s.className="seat"+(gid?" taken":"")+(isOff?" off":"")+
        (bad.has(k)?" clash":"")+((gu&&gu.role)?" vip":"");
      s.style.left=p.x+"px";s.style.top=p.y+"px";s.dataset.k=k;
      s.style.width=s.style.height=cs.d+"px";
      s.style.margin=(-cs.d/2)+"px 0 0 "+(-cs.d/2)+"px";
      s.style.fontSize=cs.f+"px";
      if(gid&&!isOff){s.style.background=col;s.style.color=tc;s.style.borderColor=fade(col,.85);}
      else{s.style.borderColor=fade(col,.5);}
      s.textContent=gid?short((guest(gid)||{}).name||""):"";
      s.title=isOff?t.name+" — chair removed":
        (gu?gu.name+(gu.role?" · "+roleLabel(gu.role):""):t.name+" — empty seat "+(i+1));
      s.onclick=()=>{if(chairMode){toggleChair(t,i);return;}if(!isOff)tapSeat(k);};
      s.ondragover=e=>{e.preventDefault();s.classList.add("target");};
      s.ondragleave=()=>s.classList.remove("target");
      s.ondrop=e=>{e.preventDefault();s.classList.remove("target");
        const id=e.dataTransfer.getData("text/plain");if(id){held=id;tapSeat(k);}};
      el.appendChild(s);
    }
    floor.appendChild(el);
  });
  requestAnimationFrame(drawTethers);
}
/* Zoom and scroll so every table and label is in view. */
function fit(){
  const wrap=$("#floorwrap"), sc=$("#floorscroll");
  const items=S.tables.map(t=>{const g=geo(t);const r=g.k==="round"?g.sr+30:Math.max(g.w,g.h)/2+60;return{x:t.x,y:t.y,r:r};})
    .concat(S.zones.map(z=>({x:z.x,y:z.y,r:70})));
  if(!items.length){zoom=.62;renderFloor();return;}
  const x0=Math.min(...items.map(o=>o.x-o.r)), x1=Math.max(...items.map(o=>o.x+o.r));
  const y0=Math.min(...items.map(o=>o.y-o.r)), y1=Math.max(...items.map(o=>o.y+o.r));
  const w=wrap.clientWidth-24, h=wrap.clientHeight-70;
  zoom=Math.max(.2,Math.min(1.2,Math.min(w/(x1-x0),h/(y1-y0))));
  renderFloor();
  sc.scrollLeft=Math.max(0,x0*zoom-(wrap.clientWidth-(x1-x0)*zoom)/2);
  sc.scrollTop=Math.max(0,y0*zoom-12);
}
/* Floor coordinates of the middle of what's on screen, for placing new things. */
function viewCenter(){
  const sc=$("#floorscroll");
  return{x:Math.round((sc.scrollLeft+sc.clientWidth/2)/zoom),y:Math.round((sc.scrollTop+sc.clientHeight/2)/zoom)};
}
/* Nearest spot to the middle of the screen that doesn't overlap another table. */
function freeSpot(shape){
  const reach=sh=>sh==="round"?175:(sh==="tall"?150:200);
  const c=viewCenter(), me=reach(shape);
  for(let ring=0;ring<30;ring++){
    const steps=Math.max(1,ring*8);
    for(let k=0;k<steps;k++){
      const a=k/steps*2*Math.PI, x=Math.round(c.x+Math.cos(a)*ring*70), y=Math.round(c.y+Math.sin(a)*ring*70);
      if(x<me||y<me||x>1700-me)continue;
      if(S.tables.every(t=>Math.hypot(t.x-x,t.y-y)>reach(t.shape)+me)&&
         S.zones.every(z=>Math.hypot(z.x-x,z.y-y)>me+50))return{x:x,y:y};
    }
  }
  return{x:Math.max(160,c.x),y:floorH()-140};
}
function floorH(){return Math.max(1760,...S.tables.map(t=>t.y+320));}
function short(n){const p=n.trim().split(/\s+/);return p.length>1?p[0]+" "+p[p.length-1][0]+".":n;}

function drawTethers(){
  const svg=$("#tether");svg.innerHTML="";
  const fr=$("#floor").getBoundingClientRect();
  clashes().forEach(c=>{
    const a=document.querySelector('.seat[data-k="'+seatOf(c.a)+'"]');
    const b=document.querySelector('.seat[data-k="'+seatOf(c.b)+'"]');
    if(!a||!b)return;
    const ra=a.getBoundingClientRect(),rb=b.getBoundingClientRect();
    const ln=document.createElementNS("http://www.w3.org/2000/svg","line");
    ln.setAttribute("x1",(ra.left+ra.width/2-fr.left)/zoom);
    ln.setAttribute("y1",(ra.top+ra.height/2-fr.top)/zoom);
    ln.setAttribute("x2",(rb.left+rb.width/2-fr.left)/zoom);
    ln.setAttribute("y2",(rb.top+rb.height/2-fr.top)/zoom);
    ln.setAttribute("stroke",c.rule.type==="apart"?"#906262":"#857B4D");
    ln.setAttribute("stroke-width","1.6");ln.setAttribute("stroke-dasharray","5 4");
    svg.appendChild(ln);
  });
}

function renderHand(){

}

/* ---------- sheet ---------- */
function renderSheet(){
  const body=$("#gt-body");if(!body)return;
  const un=S.guests.filter(g=>!seatOf(g.id)).length;
  $("#sheet-sub").textContent=S.guests.length+" guests · "+un+" still to seat";

  const q=query2.trim().toLowerCase();
  if(q)list=list.filter(g=>(g.name+" "+(g.diet||"")+" "+(g.dietNote||"")+" "+(g.note||"")).toLowerCase().includes(q));
  list.sort((a,b)=>{
    if(sortBy==="table"){
      const ta=table(tableOf(a.id)),tb=table(tableOf(b.id));
      return((ta?ta.no:99)-(tb?tb.no:99))||a.name.localeCompare(b.name);
    }
    return String(a[sortBy]||"~").localeCompare(String(b[sortBy]||"~"))||a.name.localeCompare(b.name);
  });
  const opts='<option value="">— not seated —</option>'+S.tables.map(t=>
    '<option value="'+t.id+'">'+t.no+". "+esc(t.name)+"</option>").join("");
  body.innerHTML="";
  list.forEach((g,i)=>{
    const tid=tableOf(g.id);
    const tr=document.createElement("tr");
    if(tid)tr.className="on";
    tr.innerHTML=
      '<td class="num"><button class="vipbtn'+(g.role?' on':'')+'" title="'+(g.role?esc(roleLabel(g.role))+' — click to unmark':'Mark as VIP (highlighted on the plan)')+'">'+(g.role?'&#9670;':(i+1))+'</button></td>'+
      '<td><input class="cell" data-f="name"></td>'+
      '<td><select class="cell" data-f="table">'+opts+'</select></td>'+
      '<td><div class="dietcell"><select class="cell" data-f="diet">'+dietOpts+'</select>'+
        '<input class="cell note2" data-f="dietNote" placeholder="Specifics"></div></td>'+
      '<td><input class="cell" data-f="note" placeholder="e.g. College friend"></td>'+
      '<td><button class="x" title="Remove guest">&times;</button></td>';
    tr.querySelector('[data-f="name"]').value=g.name;
    tr.querySelector('[data-f="diet"]').value=DIETS.includes(g.diet)?g.diet:(g.diet?"Other":"");
    tr.querySelector('[data-f="dietNote"]').value=g.dietNote||"";
    tr.querySelector('[data-f="note"]').value=g.note||"";
    tr.querySelector('[data-f="table"]').value=tid||"";
    tr.querySelectorAll(".cell").forEach(el=>{
      el.onchange=()=>{
        const f=el.dataset.f;
        if(f==="table"){
          const cur=seatOf(g.id);if(cur)delete S.seats[cur];
          if(el.value){const k=firstOpen(el.value);
            if(k)S.seats[k]=g.id;else alert(table(el.value).name+" has no open seats. Add a seat in Tables first.");}
          touch();render();return;
        }
        g[f]=el.value;touch();
        if(f==="diet"||f==="dietNote")renderGuests();
        if(f==="name")renderFloor();
      };
    });

    tr.querySelector(".x").onclick=()=>{
      const k=seatOf(g.id);if(k)delete S.seats[k];
      S.guests=S.guests.filter(x=>x.id!==g.id);
      S.rules=S.rules.filter(r=>r.a!==g.id&&r.b!==g.id);
      touch();render();
    };
    body.appendChild(tr);
  });
}
function esc(s){return String(s).replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));}

/* ---------- interactions ---------- */
function tapSeat(k){
  const sitting=S.seats[k];
  if(held){
    if(sitting===held){held=null;render();return;}
    const prev=seatOf(held);
    if(prev)delete S.seats[prev];
    if(sitting){ if(prev)S.seats[prev]=sitting; else delete S.seats[k]; }
    S.seats[k]=held;held=null;touch();render();return;
  }
  if(sitting){held=sitting;delete S.seats[k];touch();render();}
}
function relayoutGroup(name){
  const hs=S.tables.filter(t=>t.group===name).sort((a,b)=>(a.no||0)-(b.no||0));
  if(!hs.length)return;
  const cx=hs.reduce((a,t)=>a+t.x,0)/hs.length, y=hs[0].y, w=geo(hs[0]).w;
  const start=cx-(hs.length*w)/2;
  hs.forEach((t,i)=>{t.x=start+w*(i+0.5);t.y=y;});
}
function toggleChair(t,i){
  const off=offOf(t).slice(), at=off.indexOf(i);
  if(at>=0)off.splice(at,1);
  else{
    off.push(i);const k=t.id+":"+i, gid=S.seats[k];
    if(gid){delete S.seats[k];t.off=off;const to=firstOpen(t.id);if(to)S.seats[to]=gid;}
  }
  t.off=off;touch();render();
}
/* Change a table's seat count. Guests in seats that disappear move to the
   table's remaining open seats; only if it's full do they go back to unseated. */
function setSeats(t,val){
  val=Math.max(1,Math.min(24,val|0||t.seats));
  const moved=[];
  for(let i=val;i<t.seats;i++){const k=t.id+":"+i;if(S.seats[k]){moved.push(S.seats[k]);delete S.seats[k];}}
  t.seats=val;t.off=offOf(t).filter(i=>i<val);
  let lost=0;
  moved.forEach(g=>{const k=firstOpen(t.id);if(k)S.seats[k]=g;else lost++;});
  return lost;
}

/* CSV/TSV parser that handles quoted fields, embedded commas and line breaks. */
function parseDelimited(text){
  text=text.replace(/^﻿/,"");
  const first=text.split(/\r?\n/,1)[0]||"";
  const count=c=>first.split(c).length-1;
  const d=count("\t")?"\t":(count(";")>count(",")?";":",");
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}
      else f+=c;
    }else if(c==='"'&&f==="")q=true;
    else if(c===d){row.push(f);f="";}
    else if(c==="\n"||c==="\r"){
      if(c==="\r"&&text[i+1]==="\n")i++;
      row.push(f);rows.push(row);row=[];f="";
    }else f+=c;
  }
  if(f!==""||row.length){row.push(f);rows.push(row);}
  return rows;
}
/* Minimal .xlsx reader: an .xlsx file is a zip of XML, and browsers can
   inflate zip entries natively, so no spreadsheet library is needed. */
async function readXlsx(buf){
  const u8=new Uint8Array(buf), dv=new DataView(buf), dec=new TextDecoder();
  let e=u8.length-22;
  while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;
  if(e<0)throw new Error("not a zip");
  const files={};
  let p=dv.getUint32(e+16,true);
  for(let n=dv.getUint16(e+10,true);n>0;n--){
    const nl=dv.getUint16(p+28,true), xl=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true);
    files[dec.decode(u8.subarray(p+46,p+46+nl))]={m:dv.getUint16(p+10,true),size:dv.getUint32(p+20,true),off:dv.getUint32(p+42,true)};
    p+=46+nl+xl+cl;
  }
  async function read(name){
    const f=files[name];if(!f)return null;
    const start=f.off+30+dv.getUint16(f.off+26,true)+dv.getUint16(f.off+28,true);
    const data=u8.subarray(start,start+f.size);
    if(f.m===0)return dec.decode(data);
    const out=await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer();
    return dec.decode(out);
  }
  const xml=t=>new DOMParser().parseFromString(t,"application/xml");
  const kids=(el,tag)=>[...el.getElementsByTagNameNS("*",tag)];
  const strings=[];
  const sst=await read("xl/sharedStrings.xml");
  if(sst)kids(xml(sst),"si").forEach(si=>strings.push(kids(si,"t").filter(t=>t.parentNode.localName!=="rPh").map(t=>t.textContent).join("")));
  // First sheet in workbook order.
  let path="xl/worksheets/sheet1.xml";
  const wb=await read("xl/workbook.xml"), rels=await read("xl/_rels/workbook.xml.rels");
  if(wb&&rels){
    const sh=kids(xml(wb),"sheet")[0];
    const rid=sh&&(sh.getAttribute("r:id")||sh.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships","id"));
    const rel=kids(xml(rels),"Relationship").find(r=>r.getAttribute("Id")===rid);
    if(rel){const tg=rel.getAttribute("Target");path=tg.startsWith("/")?tg.slice(1):"xl/"+tg.replace(/^\.\//,"");}
  }
  const sheet=await read(path);
  if(!sheet)throw new Error("no sheet");
  const rows=[];
  kids(xml(sheet),"row").forEach(r=>{
    const out=[];
    kids(r,"c").forEach((c,ci)=>{
      const ref=c.getAttribute("r")||"";const letters=(ref.match(/^[A-Z]+/)||[""])[0];
      let col=ci;if(letters){col=0;for(const ch of letters)col=col*26+ch.charCodeAt(0)-64;col--;}
      const t=c.getAttribute("t"), v=kids(c,"v")[0];
      let val="";
      if(t==="s")val=v?strings[+v.textContent]||"":"";
      else if(t==="inlineStr")val=kids(c,"t").map(x=>x.textContent).join("");
      else val=v?v.textContent:"";
      out[col]=val;
    });
    const at=+(r.getAttribute("r")||rows.length+1)-1;
    rows[at]=Array.from(out,x=>x||"");
  });
  return Array.from(rows,x=>x||[]);
}
/* Work out which columns hold names, notes and dietary needs, from the header
   row if there is one (works with Zola, The Knot, Google Sheets, Excel and RSVP exports). */
function rowsToGuests(rows){
  rows=rows.map(r=>r.map(c=>String(c==null?"":c).trim())).filter(r=>r.some(Boolean));
  if(!rows.length)return{guests:[],skipped:0,cols:[],header:false};
  const H=rows[0].map(h=>h.toLowerCase());
  const find=(re,not)=>H.findIndex(h=>re.test(h)&&!(not&&not.test(h)));
  const extra=/partner|plus|spouse|\b2\b|second/;
  const c={
    name:find(/^(full |guest |guest'?s |party )?names?$|^guests?$|^guest name|^name\b|^attendee/,extra),
    first:find(/^first|given/,extra), last:find(/^last|surname|family name/,extra),
    group:find(/group|relationship|relation|party|household|categor|side|circle|tag|^list/),
    note:find(/^notes?$|comment|^about/),
    diet:find(/diet|meal|allerg|food|entr[eé]e|menu/),
    rsvp:find(/rsvp|attend|status|response|coming|reply/)
  };
  const header=c.name>=0||c.first>=0;
  // A "Meal choice" column holds entrées (Chicken, Fish); only real restrictions count as dietary needs.
  const mealCol=header&&c.diet>=0&&!/diet|allerg|restrict/.test(H[c.diet]);
  if(!header){c.name=0;c.first=-1;c.last=-1;c.group=-1;c.note=rows[0].length>1?1:-1;c.diet=rows[0].length>2?2:-1;c.rsvp=-1;}
  const body=header?rows.slice(1):rows;
  const guests=[];let skipped=0;
  body.forEach(r=>{
    const name=(c.name>=0?r[c.name]:[r[c.first],c.last>=0?r[c.last]:""].filter(Boolean).join(" "))||"";
    if(!name.trim())return;
    if(c.rsvp>=0&&/declin|regret|not attending|can.?t|cannot|^no$|^n$|^not coming/i.test(r[c.rsvp]||"")){skipped++;return;}
    const d=c.diet>=0?(r[c.diet]||""):"";
    const dl=d.toLowerCase();
    const dm=DIETS.find(x=>dl===x.toLowerCase())||DIETS.find(x=>x!=="Other"&&dl.startsWith(x.toLowerCase()));
    const rest=dm?d.slice(dm.length).replace(/^[\s,;:\-–—(]+|\)$/g,""):"";
    const none=/^(none|n\/?a|no|-|—|regular|standard)$/i.test(d);
    const meal=mealCol&&d&&!dm&&!none;
    guests.push({name:name.replace(/\s+/g," ").trim(),
      note:[c.group>=0?r[c.group]:"",c.note>=0?r[c.note]:"",meal?"Meal: "+d:""].filter(Boolean).join(" · "),
      diet:(none||meal)?"":(dm||(d?"Other":"")),dietNote:(none||meal)?"":(dm?rest:d)});
  });
  const label=i=>rows[0][i];
  const cols=header?[
    ["Name",c.name>=0?label(c.name):[label(c.first),c.last>=0?label(c.last):""].filter(Boolean).join(" + ")],
    ["Note",[c.group,c.note].filter(i=>i>=0).map(label).join(" + ")],
    ["Dietary",c.diet>=0?label(c.diet):""],
    ["Skips declined",c.rsvp>=0?label(c.rsvp):""]
  ].filter(x=>x[1]):[];
  return{guests:guests,skipped:skipped,cols:cols,header:header};
}
async function readGuestFile(file){
  const n=file.name.toLowerCase();
  if(/\.(xls|numbers|ods)$/.test(n))
    throw new Error("This app reads .xlsx and .csv files. In your spreadsheet app, use File → Save As (or Download) and pick Excel (.xlsx) or CSV.");
  if(/\.xlsx$/.test(n)||file.type.includes("spreadsheetml")){
    try{return await readXlsx(await file.arrayBuffer());}
    catch(e){console.error(e);throw new Error("That Excel file couldn't be read. Try saving it as CSV instead.");}
  }
  return parseDelimited(await file.text());
}

      SHAPES.map(x=>'<button data-v="'+x[0]+'"><i style="'+x[2]+'"></i>'+x[1]+'</button>').join("")+'</div>'+
    '<label>Colour</label><div class="sw" id="et-col"></div>'+
    '<div class="note">To take away a single chair (say, the side facing the dance floor), use <b>Edit chairs</b> on the floor plan.</div>'+
    '<div class="acts"><button class="btn" id="et-rm" style="margin-right:auto">Delete table</button>'+
    '<button class="btn solid" id="et-ok">Done</button></div>');
  const q=s=>v.querySelector(s);
  const close=()=>{v.remove();if(after)after();};
  v.onclick=e=>{if(e.target===v)close();};
  q("#et-no").value=t.no;q("#et-name").value=t.name;q("#et-seats").value=t.seats;
  q("#et-no").onchange=()=>{if(setTableNo(t,+q("#et-no").value)){touch();render();}else q("#et-no").value=t.no;};
  q("#et-name").oninput=()=>{t.name=q("#et-name").value;touch();renderFloor();};
  q("#et-name").onchange=()=>{t.name=t.name.trim()||"Table "+t.no;q("#et-name").value=t.name;touch();render();};
  q("#et-seats").onchange=()=>{const lost=setSeats(t,+q("#et-seats").value);q("#et-seats").value=t.seats;touch();render();
    if(lost)alert(lost+" guest"+(lost>1?"s":"")+" no longer fit and moved back to Not yet seated.");};
  function drawShape(){q("#et-shape").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===t.shape));}
  q("#et-shape").querySelectorAll("button").forEach(b=>b.onclick=()=>{t.shape=b.dataset.v;delete t.group;touch();render();drawShape();});
  function drawCol(){
    const box=q("#et-col");box.innerHTML="";
    PAL.forEach(c=>{const b=document.createElement("button");b.style.background=c;b.title=c;
      b.style.width=b.style.height="24px";b.setAttribute("aria-pressed",(t.color||"")===c);
      b.onclick=()=>{t.color=c;touch();renderFloor();drawCol();};box.appendChild(b);});
  }
  drawShape();drawCol();
  q("#et-rm").onclick=()=>{
    const n=countAt(t.id);
    if(!confirm("Delete "+t.name+"?"+(n?" Its "+n+" guest"+(n>1?"s":"")+" will move back to Not yet seated.":"")))return;
    removeTable(t);touch();render();close();
  };
  q("#et-ok").onclick=close;
}
function rulesDialog(){
  const opts=S.guests.slice().sort((a,b)=>a.name.localeCompare(b.name))
    .map(g=>'<option value="'+g.id+'">'+esc(g.name)+"</option>").join("");
  const v=modal('<h2>Keep together, keep apart</h2>'+
    '<p class="sub">The rules everyone knows but nobody writes down. The plan flags a violation the moment it happens, and draws a line across the room between the two seats.</p>'+
    '<div class="row"><select class="field" id="r-a"><option value="">Choose a guest</option>'+opts+'</select>'+
    '<select class="field" id="r-t" style="max-width:150px"><option value="apart">must sit apart from</option>'+
    '<option value="together">must sit with</option></select>'+
    '<select class="field" id="r-b"><option value="">Choose a guest</option>'+opts+'</select>'+
    '<button class="btn" id="r-add" style="max-width:80px">Add</button></div>'+
    '<div id="r-list" style="margin-top:14px"></div>'+
    '<div class="acts"><button class="btn solid" id="r-done">Done</button></div>');
  const L=v.querySelector("#r-list");
  function draw(){
    L.innerHTML=S.rules.length?"":'<p class="sub">No rules yet.</p>';
    S.rules.forEach(r=>{
      const a=guest(r.a),b=guest(r.b);if(!a||!b)return;
      const row=document.createElement("div");row.className="rule";
      row.innerHTML='<span class="kind '+r.type+'">'+r.type+'</span><span class="who"></span><button class="btn tiny">Remove</button>';
      row.querySelector(".who").textContent=a.name+" · "+b.name;
      row.querySelector("button").onclick=()=>{S.rules=S.rules.filter(x=>x.id!==r.id);touch();draw();render();};
      L.appendChild(row);
    });
  }
  v.querySelector("#r-add").onclick=()=>{
    const a=v.querySelector("#r-a").value,b=v.querySelector("#r-b").value;
    if(!a||!b||a===b)return;
    S.rules.push({id:uid(),type:v.querySelector("#r-t").value,a:a,b:b});touch();draw();render();
  };
  v.querySelector("#r-done").onclick=()=>v.remove();
  draw();
}
function dietText(g){
  const d=(g.diet||"").trim(), n=(g.dietNote||"").trim();
  return d&&n?d+" — "+n:(d||n);
}
function csvCell(x){return'"'+String(x==null?"":x).replace(/"/g,'""')+'"';}
function exportDialog(){
  const ts=S.tables.slice().sort((a,b)=>(a.no||0)-(b.no||0));
  let txt=(S.title?S.title.toUpperCase()+"\n\n":""),csv="Table no,Table,Seat,Guest,Dietary\n";
  ts.forEach(t=>{
    txt+=t.no+". "+t.name.toUpperCase()+"\n";
    for(let i=0;i<t.seats;i++){
      if(offOf(t).includes(i))continue;
      const g=guest(S.seats[t.id+":"+i]);
      txt+="   Seat "+(i+1)+": "+(g?g.name+(dietText(g)?"  ["+dietText(g)+"]":""):"—")+"\n";
      csv+=[t.no,csvCell(t.name),i+1,csvCell(g?g.name:""),csvCell(g?dietText(g):"")].join(",")+"\n";
    }
    txt+="\n";
  });
  const un=S.guests.filter(g=>!seatOf(g.id));
  if(un.length)txt+="NOT YET SEATED ("+un.length+")\n"+un.map(g=>"   "+g.name).join("\n")+"\n";
  const v=modal('<h2>Export &amp; backup</h2><p class="sub">Send the seating list to your caterer, calligrapher or day-of coordinator.</p>'+
    '<div class="acts" style="justify-content:flex-start;margin-top:0">'+
    '<button class="btn" id="e-l">Show seating list</button><button class="btn" id="e-c">Download CSV</button>'+
    '<button class="btn" id="e-cp">Copy text</button></div>'+
    '<textarea class="mono" id="e-t" style="margin-top:12px;min-height:220px" readonly></textarea>'+
    '<h3>Backup</h3>'+
    '<p class="sub">Your plan is saved in this browser only. Download a backup file to keep it safe, '+
    'move it to another computer, or send it to your partner or planner, who can open it here with <b>Open a backup</b>.</p>'+
    '<div class="acts" style="justify-content:flex-start;margin-top:0">'+
    '<button class="btn solid" id="e-b">Download backup</button>'+
    '<button class="btn" id="e-r">Open a backup</button></div>'+
    '<div class="acts"><button class="btn" id="e-x">Close</button></div>');
  const ta=v.querySelector("#e-t");ta.value=txt;
  v.querySelector("#e-l").onclick=()=>ta.value=txt;
  v.querySelector("#e-c").onclick=()=>download(fileSlug()+".csv",csv,"text/csv");
  v.querySelector("#e-cp").onclick=()=>{
    const b=v.querySelector("#e-cp");
    const done=()=>{b.textContent="Copied";setTimeout(()=>b.textContent="Copy text",1500);};
    if(navigator.clipboard)navigator.clipboard.writeText(ta.value).then(done,()=>{ta.select();document.execCommand("copy");done();});
    else{ta.select();try{document.execCommand("copy");}catch(e){}done();}
  };
  v.querySelector("#e-b").onclick=()=>download(fileSlug()+"-backup.json",serialize(),"application/json");
  v.querySelector("#e-r").onclick=()=>openBackup(()=>v.remove());
  v.querySelector("#e-x").onclick=()=>v.remove();
}
function openBackup(after){
  const inp=document.createElement("input");inp.type="file";inp.accept=".json,application/json";
  inp.onchange=()=>{
    const f=inp.files&&inp.files[0];if(!f)return;
    f.text().then(txt=>{
      let d;try{d=JSON.parse(txt);}catch(err){alert("That file is not a seating plan backup.");return;}
      if(!d||!Array.isArray(d.guests)||!Array.isArray(d.tables)){alert("That backup is missing its guests or tables.");return;}
      if((S.guests.length||S.tables.length)&&
         !confirm("Replace the current plan with this backup? "+d.guests.length+" guests, "+d.tables.length+" tables."))return;
      replacePlan(d);if(after)after();
    });
  };
  inp.click();
}
function renamePlan(){
  const v=modal('<h2>Name this plan</h2><p class="sub">Shown at the top of the plan and on exports.</p>'+
    '<input class="field" id="n-t" placeholder="e.g. Sam &amp; Alex · June 14">'+
    '<div class="acts"><button class="btn" id="n-x">Cancel</button><button class="btn solid" id="n-ok">Save</button></div>');
  const inp=v.querySelector("#n-t");inp.value=S.title||"";inp.focus();
  const ok=()=>{S.title=inp.value.trim();touch();render();v.remove();};
  inp.onkeydown=e=>{if(e.key==="Enter")ok();};
  v.querySelector("#n-ok").onclick=ok;
  v.querySelector("#n-x").onclick=()=>v.remove();
}
function welcome(){
  const has=S.guests.length||S.tables.length;
  const v=modal('<h2>'+(has?"Start a new plan":"Welcome")+'</h2>'+
    '<p class="sub">Set up your room in a few seconds. You can rename tables, change seats, and drag everything around afterwards.</p>'+
    '<div class="row"><input class="field" id="w-a" placeholder="Your name"><input class="field" id="w-b" placeholder="Partner&rsquo;s name"></div>'+
    '<div class="row" style="margin-top:12px">'+
      '<label style="margin:0;flex:1">Guest tables<input class="field" id="w-n" type="number" min="1" max="40" value="10" style="margin-top:5px"></label>'+
      '<label style="margin:0;flex:1">Seats each<input class="field" id="w-s" type="number" min="2" max="24" value="8" style="margin-top:5px"></label>'+
      '<label style="margin:0;flex:1.4">Table shape<select class="field" id="w-sh" style="margin-top:5px">'+
        '<option value="round">Round</option><option value="tall">Long (vertical)</option><option value="rect">Long (horizontal)</option></select></label></div>'+
    '<label class="check" style="margin-top:14px"><input type="checkbox" id="w-h" checked> Add a head table and seat us there</label>'+
    (has?'<div class="note">This replaces your current plan. Download a backup first from <b>Export &amp; backup</b> if you want to keep it.</div>':
      '<div class="note">Your plan saves automatically in this browser. Nothing is uploaded anywhere.</div>')+
    '<div class="acts">'+
      '<button class="btn" id="w-o">Open a backup</button>'+
      '<button class="btn" id="w-d">Explore a sample</button>'+
      (has?'<button class="btn" id="w-x">Cancel</button>':'')+
      '<button class="btn solid" id="w-ok">Create plan</button></div>');
  if(!has)v.onclick=null;
  v.querySelector("#w-o").onclick=()=>openBackup(()=>v.remove());
  v.querySelector("#w-d").onclick=()=>{
    if(has&&!confirm("Replace your current plan with the sample?"))return;
    replacePlan(samplePlan());v.remove();$("#z-fit").click();
  };
  if(has)v.querySelector("#w-x").onclick=()=>v.remove();
  v.querySelector("#w-ok").onclick=()=>{
    const a=v.querySelector("#w-a").value.trim(), b=v.querySelector("#w-b").value.trim();
    const n=Math.max(1,Math.min(40,+v.querySelector("#w-n").value||10));
    const st=Math.max(2,Math.min(24,+v.querySelector("#w-s").value||8));
    const head=v.querySelector("#w-h").checked;
    const p=blankPlan();
    p.title=a&&b?a+" & "+b:(a||b);
    p.tables=buildTables(n,st,v.querySelector("#w-sh").value,head);
    [a,b].filter(Boolean).forEach((nm,i)=>{
      const g={id:uid(),name:nm,diet:"",dietNote:"",note:"",role:"couple"};p.guests.push(g);
      if(head)p.seats[p.tables[0].id+":"+(i+1)]=g.id;
    });
    replacePlan(p);v.remove();$("#z-fit").click();
    if(!p.guests.length||p.guests.length<3)importGuests();
  };
}

/* ---------- wiring ---------- */
function setView(v){
  view=v;
  $("#v-floor").hidden=(v!=="floor");$("#v-sheet").hidden=(v!=="sheet");
  $("#tab-floor").setAttribute("aria-selected",v==="floor");
  $("#tab-sheet").setAttribute("aria-selected",v==="sheet");
  if(v==="floor")requestAnimationFrame(drawTethers);
}
$("#tab-floor").onclick=()=>setView("floor");
$("#tab-sheet").onclick=()=>setView("sheet");
$("#b-import").onclick=()=>importGuests();
$("#b-table").onclick=tablesDialog;
$("#b-addtable").onclick=tablesDialog;
$("#b-chairs").onclick=()=>{
  chairMode=!chairMode;held=null;
  $("#b-chairs").setAttribute("aria-pressed",chairMode);
  $("#b-chairs").textContent=chairMode?"Done editing":"Edit chairs";
  $("#floor").classList.toggle("chairs",chairMode);
  $("#handbar").innerHTML=chairMode?
    '<div class="hint">Click any chair to remove it, or a dashed one to put it back.</div>':"";
  renderFloor();
};
$("#b-rules").onclick=rulesDialog;
$("#b-export").onclick=exportDialog;
$("#b-new").onclick=welcome;
$("#evt").onclick=renamePlan;
$("#save").onclick=save;
window.addEventListener("beforeunload",e=>{
  clearTimeout(t_);save();
  if(serialize()!==lastSaved){e.preventDefault();e.returnValue="";}
});
$("#b-print").onclick=()=>window.print();
$("#b-addrow").onclick=()=>{
  S.guests.push({id:uid(),name:"New guest",diet:"",dietNote:""});touch();render();
};
$("#q").oninput=e=>{query=e.target.value;renderGuests();};
$("#q2").oninput=e=>{query2=e.target.value;renderSheet();};
document.querySelectorAll("th[data-sort]").forEach(th=>{
  th.onclick=()=>{sortBy=th.dataset.sort;renderSheet();};
});
["unseated","diet"].forEach(f=>{
  const b=$("#f-"+f);
  b.onclick=()=>{filters[f]=!filters[f];b.setAttribute("aria-pressed",filters[f]);renderGuests();};
});
$("#z-in").onclick=()=>{zoom=Math.min(1.8,zoom+.12);renderFloor();};
$("#z-out").onclick=()=>{zoom=Math.max(.2,zoom-.12);renderFloor();};
$("#z-fit").onclick=fit;
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){
    const v=document.querySelector(".veil");
    if(v&&v.onclick)v.remove(); else if(!v&&held){held=null;render();}
  }
});
/* Dropping a spreadsheet anywhere on the page opens the import with it. */
const hasFiles=e=>e.dataTransfer&&[...e.dataTransfer.types].includes("Files");
window.addEventListener("dragover",e=>{if(hasFiles(e))e.preventDefault();});
window.addEventListener("drop",e=>{
  if(!hasFiles(e))return;
  e.preventDefault();
  if(document.querySelector(".veil"))return;
  importGuests(e.dataTransfer.files[0]);
});
$("#b-side").onclick=()=>$("#aside").classList.toggle("open");
window.addEventListener("resize",()=>{if(view==="floor")requestAnimationFrame(drawTethers);});
load();
})();
</script>
</body>
</html>
